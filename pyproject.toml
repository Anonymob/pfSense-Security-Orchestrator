[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfsense-security-orchestrator"
version = "0.1.0"
description = "Modular, audit-first pfSense vulnerability assessment and hardening orchestration framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["paramiko>=3.5,<4", "cryptography>=42,<47"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# Third-party packages may register reviewed audit modules under this group.
# Loading them is opt-in in the interactive CLI because importing plugins runs code.
[project.entry-points."pfsense_guard.modules"]

[tool.setuptools.packages.find]
include = ["pfsense_guard*"]

[tool.setuptools.package-data]
pfsense_guard = ["php/*.php"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
